version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: nexuscare_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: nexuscare_mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    restart: unless-stopped

volumes:
  redis_data:
