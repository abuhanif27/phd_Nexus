version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: nexuscare_db
    environment:
      POSTGRES_DB: nexuscare
      POSTGRES_USER: nexuscare
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuscare"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexuscare_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexuscare_backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgres://nexuscare:${DB_PASSWORD:-changeme}@db:5432/nexuscare
      REDIS_URL: redis://redis:6379/0
      DEBUG: "0"
    volumes:
      - media_data:/app/media
      - ai_models:/app/ai_models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nexuscare_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL:-http://localhost}/api
      NEXT_PUBLIC_APP_NAME: NexusCare
      NEXT_PUBLIC_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nexuscare_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  ai_models:
