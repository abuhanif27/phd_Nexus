<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication Test - NexusCare</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        background: #1a1a1a;
        color: #00ff00;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .section {
        background: #2a2a2a;
        border: 2px solid #00ff00;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
      }
      h1 {
        color: #00ff00;
        text-shadow: 0 0 10px #00ff00;
      }
      h2 {
        color: #00ffff;
        border-bottom: 1px solid #00ffff;
        padding-bottom: 10px;
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
      }
      .success {
        background: #004400;
        border: 1px solid #00ff00;
      }
      .error {
        background: #440000;
        border: 1px solid #ff0000;
        color: #ff4444;
      }
      .warning {
        background: #444400;
        border: 1px solid #ffff00;
        color: #ffff00;
      }
      button {
        background: #00ff00;
        color: #000;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        margin: 5px;
      }
      button:hover {
        background: #00cc00;
      }
      pre {
        background: #000;
        padding: 15px;
        border-radius: 4px;
        overflow-x: auto;
        border: 1px solid #00ff00;
      }
      .token-preview {
        word-break: break-all;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>🔐 NexusCare Authentication Debugger</h1>

    <div class="section">
      <h2>📊 Current Authentication Status</h2>
      <div id="authStatus">Checking...</div>
    </div>

    <div class="section">
      <h2>🔑 Token Information</h2>
      <div id="tokenInfo">Checking...</div>
    </div>

    <div class="section">
      <h2>🧪 API Test: GET /api/doctors/</h2>
      <button onclick="testDoctorsAPI()">Test API Call</button>
      <button onclick="testDoctorsAPINoAuth()">Test Without Auth</button>
      <div id="apiResult" style="margin-top: 15px"></div>
    </div>

    <div class="section">
      <h2>🛠️ Actions</h2>
      <button onclick="location.href='login.html'">Go to Login</button>
      <button onclick="clearAuth()">Clear All Auth Data</button>
      <button onclick="location.reload()">Refresh Page</button>
    </div>

    <div class="section">
      <h2>📋 Console Logs</h2>
      <pre id="logs"></pre>
    </div>

    <script>
      const API_BASE_URL = "http://localhost:8000/api";
      let logBuffer = [];

      function log(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const prefix =
          type === "error" ? "❌" : type === "success" ? "✅" : "ℹ️";
        const logLine = `[${timestamp}] ${prefix} ${message}`;

        console.log(logLine);
        logBuffer.push(logLine);

        // Keep only last 50 logs
        if (logBuffer.length > 50) {
          logBuffer.shift();
        }

        document.getElementById("logs").textContent = logBuffer.join("\n");
      }

      function checkAuthStatus() {
        log("Checking authentication status...");

        const token = localStorage.getItem("accessToken");
        const refresh = localStorage.getItem("refreshToken");
        const email = localStorage.getItem("userEmail");
        const role = localStorage.getItem("userRole");

        const statusDiv = document.getElementById("authStatus");

        if (!token) {
          statusDiv.innerHTML = `
                    <div class="status error">
                        <h3>❌ NOT LOGGED IN</h3>
                        <p>No access token found in localStorage</p>
                        <button onclick="location.href='login.html'">Login Now</button>
                    </div>
                `;
          log("No access token found", "error");
          return false;
        }

        statusDiv.innerHTML = `
                <div class="status success">
                    <h3>✅ LOGGED IN</h3>
                    <p><strong>Email:</strong> ${email || "Unknown"}</p>
                    <p><strong>Role:</strong> ${role || "Unknown"}</p>
                    <p><strong>Has Refresh Token:</strong> ${
                      refresh ? "Yes" : "No"
                    }</p>
                </div>
            `;

        log(`Logged in as: ${email} (${role})`, "success");
        return true;
      }

      function showTokenInfo() {
        log("Displaying token information...");

        const token = localStorage.getItem("accessToken");
        const tokenDiv = document.getElementById("tokenInfo");

        if (!token) {
          tokenDiv.innerHTML = `
                    <div class="status error">
                        <p>No token to display</p>
                    </div>
                `;
          return;
        }

        // Parse JWT (format: header.payload.signature)
        try {
          const parts = token.split(".");
          if (parts.length !== 3) {
            throw new Error("Invalid JWT format");
          }

          const payload = JSON.parse(atob(parts[1]));
          const exp = new Date(payload.exp * 1000);
          const now = new Date();
          const isExpired = exp < now;

          tokenDiv.innerHTML = `
                    <div class="status ${isExpired ? "error" : "success"}">
                        <p><strong>Token Length:</strong> ${
                          token.length
                        } characters</p>
                        <p><strong>Issued At:</strong> ${new Date(
                          payload.iat * 1000
                        ).toLocaleString()}</p>
                        <p><strong>Expires At:</strong> ${exp.toLocaleString()}</p>
                        <p><strong>Status:</strong> ${
                          isExpired ? "❌ EXPIRED" : "✅ VALID"
                        }</p>
                        ${
                          isExpired
                            ? '<p style="color: #ff4444;">Token has expired! Please login again.</p>'
                            : ""
                        }
                        <details style="margin-top: 10px;">
                            <summary style="cursor: pointer;">Show Token Preview</summary>
                            <div class="token-preview" style="margin-top: 10px;">
                                <strong>Header:</strong> ${parts[0].substring(
                                  0,
                                  30
                                )}...<br>
                                <strong>Payload:</strong> ${parts[1].substring(
                                  0,
                                  30
                                )}...<br>
                                <strong>Signature:</strong> ${parts[2].substring(
                                  0,
                                  30
                                )}...
                            </div>
                        </details>
                        <details style="margin-top: 10px;">
                            <summary style="cursor: pointer;">Show Decoded Payload</summary>
                            <pre style="margin-top: 10px;">${JSON.stringify(
                              payload,
                              null,
                              2
                            )}</pre>
                        </details>
                    </div>
                `;

          log(
            `Token expires at: ${exp.toLocaleString()} (${
              isExpired ? "EXPIRED" : "valid"
            })`,
            isExpired ? "error" : "success"
          );
        } catch (error) {
          tokenDiv.innerHTML = `
                    <div class="status error">
                        <p><strong>Error parsing token:</strong> ${
                          error.message
                        }</p>
                        <p>Token may be malformed or corrupted</p>
                        <details>
                            <summary>Show Raw Token (first 100 chars)</summary>
                            <div class="token-preview">${token.substring(
                              0,
                              100
                            )}...</div>
                        </details>
                    </div>
                `;
          log(`Token parsing error: ${error.message}`, "error");
        }
      }

      async function testDoctorsAPI() {
        log("Testing /api/doctors/ WITH authentication...");

        const resultDiv = document.getElementById("apiResult");
        resultDiv.innerHTML = '<div class="status warning">⏳ Loading...</div>';

        const token = localStorage.getItem("accessToken");

        if (!token) {
          resultDiv.innerHTML =
            '<div class="status error">❌ No token available</div>';
          log("Cannot test API - no token", "error");
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/doctors/`, {
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
          });

          log(`API Response: ${response.status} ${response.statusText}`);

          const data = await response.json();

          if (response.ok) {
            const doctors = data.results || data || [];
            resultDiv.innerHTML = `
                        <div class="status success">
                            <h3>✅ SUCCESS</h3>
                            <p><strong>Status:</strong> ${response.status} ${
              response.statusText
            }</p>
                            <p><strong>Doctors Found:</strong> ${
                              doctors.length
                            }</p>
                            <details>
                                <summary>Show Response Data</summary>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </details>
                        </div>
                    `;
            log(`Success! Found ${doctors.length} doctors`, "success");
          } else {
            resultDiv.innerHTML = `
                        <div class="status error">
                            <h3>❌ FAILED</h3>
                            <p><strong>Status:</strong> ${response.status} ${
              response.statusText
            }</p>
                            <p><strong>Error:</strong> ${
                              data.detail || "Unknown error"
                            }</p>
                            <details>
                                <summary>Show Full Response</summary>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </details>
                        </div>
                    `;
            log(`API Error: ${response.status} - ${data.detail}`, "error");
          }
        } catch (error) {
          resultDiv.innerHTML = `
                    <div class="status error">
                        <h3>❌ NETWORK ERROR</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Backend may not be running or CORS issue</p>
                    </div>
                `;
          log(`Network error: ${error.message}`, "error");
        }
      }

      async function testDoctorsAPINoAuth() {
        log("Testing /api/doctors/ WITHOUT authentication...");

        const resultDiv = document.getElementById("apiResult");
        resultDiv.innerHTML = '<div class="status warning">⏳ Loading...</div>';

        try {
          const response = await fetch(`${API_BASE_URL}/doctors/`);
          const data = await response.json();

          log(
            `API Response (no auth): ${response.status} ${response.statusText}`
          );

          resultDiv.innerHTML = `
                    <div class="status ${response.ok ? "success" : "error"}">
                        <h3>${response.ok ? "✅" : "❌"} Response</h3>
                        <p><strong>Status:</strong> ${response.status} ${
            response.statusText
          }</p>
                        <p><strong>Expected:</strong> Should be 401 Unauthorized</p>
                        <details>
                            <summary>Show Response</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    </div>
                `;

          if (response.status === 401) {
            log("✅ Endpoint correctly requires authentication", "success");
          } else {
            log("⚠️ Warning: Endpoint did not require authentication", "error");
          }
        } catch (error) {
          resultDiv.innerHTML = `
                    <div class="status error">
                        <h3>❌ NETWORK ERROR</h3>
                        <p>${error.message}</p>
                    </div>
                `;
          log(`Network error: ${error.message}`, "error");
        }
      }

      function clearAuth() {
        if (confirm("Clear all authentication data from localStorage?")) {
          log("Clearing all authentication data...");
          localStorage.removeItem("accessToken");
          localStorage.removeItem("refreshToken");
          localStorage.removeItem("userEmail");
          localStorage.removeItem("userRole");
          log("Authentication data cleared", "success");
          location.reload();
        }
      }

      // Initialize on page load
      window.addEventListener("DOMContentLoaded", () => {
        log("Authentication Debugger loaded");
        checkAuthStatus();
        showTokenInfo();
      });
    </script>
  </body>
</html>
