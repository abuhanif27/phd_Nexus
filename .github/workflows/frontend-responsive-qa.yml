name: Frontend Responsive QA

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-responsive-qa.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-responsive-qa.yml'
  workflow_dispatch:

jobs:
  responsive-and-visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Responsive overflow audit
        run: npm run test:e2e:responsive

      - name: Visual snapshots
        run: npm run test:e2e:visual -- --update-snapshots

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

      - name: Upload Playwright snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: frontend/tests/e2e
          retention-days: 14
